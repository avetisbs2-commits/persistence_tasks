# Where is your MongoDB?
#
# The default is a MongoDB that you installed on your own computer, with the default settings:
#   host: localhost, port: 27017, no user and no password.
#
# If your MongoDB needs a user and a password, write them in the address:
#   mongo.uri=mongodb://myuser:mypassword@localhost:27017
mongo.uri=mongodb://localhost:27017

# The name of the database. MongoDB creates it by itself the first time you save something in it.
mongo.database=nosql_crud
